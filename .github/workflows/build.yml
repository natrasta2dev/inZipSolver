name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compiler l'APK
        run: gradle --no-daemon assembleDebug

      - name: Publier l'APK (release « latest »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk InReflexGameSolver.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest InReflexGameSolver.apk \
            --target "${GITHUB_SHA}" \
            --title "InReflex Game Solver — dernière version" \
            --notes "Télécharge InReflexGameSolver.apk depuis ton téléphone Android et installe-le."

      - uses: actions/upload-artifact@v4
        with:
          name: InReflexGameSolver
          path: InReflexGameSolver.apk
