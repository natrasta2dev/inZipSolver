name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compiler l'APK
        run: gradle --no-daemon assembleDebug

      - name: Publier une release versionnée
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk InZipSolver.apk
          NOTES="release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "${GITHUB_REF_NAME}" InZipSolver.apk \
            --title "InZip Solver ${GITHUB_REF_NAME}" \
            --notes-file "$NOTES" \
            --latest

      - name: Publier l'APK (release « latest »)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk InZipSolver.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest InZipSolver.apk \
            --target "${GITHUB_SHA}" \
            --title "InZip Solver — dernière version" \
            --notes "Télécharge InZipSolver.apk depuis ton téléphone Android et installe-le."

      - uses: actions/upload-artifact@v4
        with:
          name: InZipSolver
          path: InZipSolver.apk
